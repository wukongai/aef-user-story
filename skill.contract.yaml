name: aef-user-story
kind: technique
owner: wukongai
status: candidate
version: 0.5.0
scope: direct/manual/composed

inputs:
  - name: raw_requirement
    type: text_or_readable_attachment
    required: false
  - name: existing_context
    type: text_or_story_package
    required: false
  - name: target_project
    type: readable_project_path
    required: false
  - name: constraints
    type: list
    required: false

outputs:
  - name: product_system_outline
    type: versioned_project_markdown
    required: false
  - name: mvp_scope_proposal
    type: versioned_references_and_scope_decision
    required: false
  - name: story_library
    type: aef-story-library/v1
    required: false
  - name: pinned_story_reference
    type: story_and_acceptance_revisions
    required: false
  - name: continuous_story_workspace
    type: aef-story-workspace/v1
    required: false
  - name: story_package
    type: markdown_and_json
    required: false
  - name: story_card_v2
    type: aef-story-card/v2
    required: false
  - name: next_step
    type: capability_routes
    required: false

stops:
  - name: clarification_required
    condition: 缺失的用户、场景、目标或价值事实会实质改变 Story 边界
  - name: story_review
    condition: 本轮指定 Story ID 和修订已准备好，但用户尚未确认
  - name: acceptance_review
    condition: Acceptance Criteria 已准备好，但用户尚未确认
  - name: project_write_preview
    condition: 实际格式的文件集合、路径与内容已准备好，但用户尚未明确批准写入
  - name: write_conflict
    condition: 目标文件已存在且内容不同，禁止静默覆盖
  - name: sensitive_input
    condition: 原始输入包含尚未脱敏的凭证、个人隐私或机密材料
  - name: unreadable_input
    condition: 宿主无法读取必要附件
  - name: specialist_review
    condition: 需要法律、医疗、金融、隐私、安全、权限、合规、支付或迁移专项审批

delegates:
  - name: downstream_requirement_skill
    contract: 传统正式route保留已确认Story/Acceptance及route、target_id、建议路径；当前故事库交接固定ID与修订及真实确认状态。探索交接允许候选Story和缺失AC，列明未知与启动条件；不得标为开发就绪。开发承诺需核对Story/AC确认、可行性、依赖和容量，由后续能力及用户决定
  - name: specialist_review
    contract: 交接风险摘要、已知事实、未知项和所需决策负责人

forbidden:
  - invented_user_facts
  - technical_tasks_as_user_stories
  - acceptance_before_story_confirmation
  - ready_status_before_acceptance_confirmation
  - silent_project_overwrite
  - formal_prd_generation
  - technical_spec_generation
  - task_or_code_generation
  - story_points_estimation
  - credentials_or_sensitive_raw_material_in_outputs
  - hardcoded_user_absolute_paths
  - training_course_structure_as_product_fact

approvals:
  - name: story_set_confirmation
    satisfied_by: 用户明确确认本轮指定 Story ID 和修订
  - name: acceptance_confirmation
    satisfied_by: 用户明确确认 Acceptance Criteria
  - name: project_write
    satisfied_by: 用户明确批准目标路径和内容摘要

side_effect_boundary:
  conversation_is_read_only: true
  network_calls: false
  project_writes_require_approval: true
  existing_files_require_separate_conflict_approval: true
  lifecycle_state_owned_by_host: true

state:
  strategy: per-story independent data and Markdown cards with Epic index in aef-story-library/v1; append-only versions; workspace/v1 and story-card/v2 compatibility preserved
  secrets_allowed: false

scripts:
  - path: scripts/story_library.py
    side_effect: none
  - path: scripts/story_workspace.py
    side_effect: none
  - path: scripts/validate_story_card.py
    side_effect: none
  - path: scripts/validate_story_package.py
    side_effect: none

tests:
  commands:
    - python3 tests/test_validate_story_card.py -v
    - python3 tests/test_validate_story_package.py -v
    - python3 tests/test_skill_contract.py -v
    - python3 tests/test_examples.py -v
    - python3 -B tests/test_story_library.py -v
  fixtures:
    valid_v1: tests/fixtures/valid-story-card.json
    valid_v2: tests/fixtures/valid-story-card-v2.json
    invalid_v2: tests/fixtures/invalid-story-card-v2.json
  scenario_index: tests/scenario-index.json
  regression_cases:
    - tests/cases/tool-recommendation.yaml
    - tests/system-dialogue-cases.md
    - tests/core-unit-mvp-cases.md
    - tests/stage-closure-cases.md
    - tests/story-map-handoff-cases.md
    - tests/iteration-handoff-cases.md
    - tests/task-focus-cases.md
    - tests/cases/success.yaml
    - tests/cases/failure.yaml
    - tests/cases/high-risk.yaml
    - tests/cases/negative-trigger.yaml

evaluation:
  suite_id: aef-user-story-v0-5
  score_scope: structural_readiness
  claims:
    utility: false
  baseline: tests/baseline.json
  case_portfolio:
    success: tests/cases/success.yaml
    failure: tests/cases/failure.yaml
    high_risk: tests/cases/high-risk.yaml
    negative_trigger: tests/cases/negative-trigger.yaml
  negative_transfer: reject_if_negative_trigger_becomes_active
  real_trial_required: true
  independent_review_required_for_generalization_claim: true
